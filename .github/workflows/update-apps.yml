name: Update MCP Apps

on:
  schedule:
    # Run every day at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  update-apps:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Search for new MCP Apps
        id: search
        run: |
          # Create a temporary file to store search results
          mkdir -p tmp
          
          # Search GitHub for MCP Apps repositories
          # Note: You'll need to add GITHUB_TOKEN as a secret
          echo "Searching for MCP Apps on GitHub..."
          
          # Search for repositories mentioning MCP Apps
          curl -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               "https://api.github.com/search/repositories?q=mcp+apps+in:name,description,readme&sort=stars&order=desc&per_page=50" \
               > tmp/search_results_apps.json
               
          # Search for @modelcontextprotocol/ext-apps usage
          curl -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               "https://api.github.com/search/code?q=%22@modelcontextprotocol/ext-apps%22+language:json&per_page=50" \
               > tmp/search_results_code.json
          
          # Search for ui:// protocol usage
          curl -H "Accept: application/vnd.github.v3+json" \
               -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
               "https://api.github.com/search/code?q=ui://+MCP&per_page=50" \
               > tmp/search_results_ui.json
          
          echo "Search completed. Results saved to tmp/"
          
      - name: Process search results
        run: |
          echo "Processing search results..."
          node -e "
          const fs = require('fs');
          
          // Read existing README
          const readme = fs.readFileSync('README.md', 'utf8');
          
          // Read search results
          let newApps = [];
          
          try {
            const appsResults = JSON.parse(fs.readFileSync('tmp/search_results_apps.json', 'utf8'));
            const codeResults = JSON.parse(fs.readFileSync('tmp/search_results_code.json', 'utf8'));
            const uiResults = JSON.parse(fs.readFileSync('tmp/search_results_ui.json', 'utf8'));
            
            // Process repository results
            if (appsResults.items) {
              newApps = appsResults.items.map(item => ({
                name: item.name,
                url: item.html_url,
                description: item.description || 'No description available',
                stars: item.stargazers_count,
                language: item.language
              }));
            }
            
            // Filter out apps already in README
            newApps = newApps.filter(app => !readme.includes(app.url));
            
            // Save new apps to file for review
            if (newApps.length > 0) {
              fs.writeFileSync('tmp/new_apps.json', JSON.stringify(newApps, null, 2));
              console.log('Found ' + newApps.length + ' new potential MCP Apps');
              console.log(JSON.stringify(newApps, null, 2));
            } else {
              console.log('No new apps found');
            }
          } catch (error) {
            console.error('Error processing results:', error.message);
          }
          "
          
      - name: Create issue with new apps
        if: hashFiles('tmp/new_apps.json') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            try {
              const newApps = JSON.parse(fs.readFileSync('tmp/new_apps.json', 'utf8'));
              
              if (newApps.length === 0) return;
              
              let body = '## New MCP Apps Found\n\n';
              body += 'The automated search found the following potential MCP Apps. Please review and add them to the appropriate categories:\n\n';
              
              newApps.forEach(app => {
                body += `### [${app.name}](${app.url})\n`;
                body += `- **Description**: ${app.description}\n`;
                body += `- **Stars**: ${app.stars}\n`;
                body += `- **Language**: ${app.language || 'Unknown'}\n\n`;
              });
              
              body += '\n---\n*This issue was automatically generated by the Update MCP Apps workflow.*';
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Auto] New MCP Apps Found - ${new Date().toISOString().split('T')[0]}`,
                body: body,
                labels: ['new-apps', 'automated']
              });
            } catch (error) {
              console.error('Error creating issue:', error);
            }
            
      - name: Update stats badge
        run: |
          # Count current number of apps in README
          APP_COUNT=$(grep -c "^\- \[" README.md || echo "0")
          echo "Total apps: $APP_COUNT"
          
          # Create a badge JSON
          echo "{\"schemaVersion\":1,\"label\":\"MCP Apps\",\"message\":\"$APP_COUNT\",\"color\":\"blue\"}" > tmp/badge.json
          
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Check if there are any changes
          if [[ -n $(git status -s) ]]; then
            git add tmp/badge.json
            git commit -m "chore: Update stats badge" || echo "No changes to commit"
            git push || echo "Nothing to push"
          fi
